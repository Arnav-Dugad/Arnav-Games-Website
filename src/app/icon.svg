<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Arnav Games">
  <!--
    Animated favicon: a glint sweeps across the tile every few seconds.
    Only some browsers animate SVG favicons (Firefox does; Chromium and Safari
    rasterise the first frame), so frame zero is the plain mark with the glint
    parked off the tile - every browser that doesn't animate shows exactly the
    static icon. The sweep only runs when the OS doesn't ask for reduced motion.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .glint { animation: sweep 5s cubic-bezier(.45,0,.2,1) 1.2s infinite; }
    }
    @keyframes sweep {
      0% { transform: translateX(0); }
      22%, 100% { transform: translateX(126px); }
    }
  </style>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <path d="M27.6 15h8.8L49 49h-8.3l-2.6-7.4H25.9L23.3 49H15zm-.1 19.9h9L32 21.6z" fill="#fff"/>
  <g clip-path="url(#c)">
    <g transform="rotate(20 32 32)">
      <rect class="glint" x="-42" y="-20" width="20" height="104" fill="url(#s)"/>
    </g>
  </g>
</svg>
